<html>
<head>

 span.material-symbols-outlined{

 }

<body>
<header>
  <h1 class="main"><a href="#" style="position: absolute;top:30px;">Jam HOme</a></h1>
  <ul>
    <li><a href="#">로그인</a></li>
    <li><a href="#">회원가입</a></li>
  </ul>
</header>
<div>
  <xmp class="code">
  </xmp>

  <img src="../images/item01.gif" alt="">
</div> 
<script>
  // item01 ~ item21 이미지 랜덤하게 클릭하는 곳에 추가
  function getRandom( min, max){
       return Math.floor( Math.random()*(max-min+1)+min);
  }

  // 마우스 우클릭시 나오는 메뉴 -> oncontextmenu
  document.oncontextmenu = function(){
    // alert("오른쪽 마우스를 사용할 수 없습니다");
    return false; // 이벤트 취소
  }

  document.onmousedown = function(){
    // console.log( event.button );
    if(event.button == 0){  //  마우스 좌클릭
      // <title></title>
      document.title = event.clientX + ", " + event.clientY + $("img").width();

      let img = document.createElement("img");

      let imgNo = getRandom(1,21).toString().padStart(2,0);
      let src = `../images/item${imgNo}.gif`;
      img.setAttribute("src",src);

      let left = event.clientX - $("img").width()/2;
      let top = event.clientY - $("img").height()/2;
      img.setAttribute("style",`position:absolute; left:${left}px; top:${top}px;`);

      document.body.appendChild(img);

    } else if(event.button == 1){ // 마우스휠 버튼
      document.body.removeChild(event.srcElement);
      
    } else if(event.button == 2){ // 마우스 우클릭
      // let imgs = document.querySelectorAll("img");  // 모든 이미지 요소 선택
      //   imgs.forEach(function(img) {
      //       img.remove();  // 각 이미지 제거
      //   });

      /* 절반씩 사라짐
      let imgs = document.images;

      for (const img of imgs) {
        console.log(imgs);
        img.remove();
      }
      */
    }
  }
</script>
</body>
</html>
