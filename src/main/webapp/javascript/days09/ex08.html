<div>
  <xmp class="code">
    BOM
    ㄴ window
    ㄴ screen 객체
       - 사용자 화면에 대한 정보를 가지고 있는 객체
       screen.width 화면 너비
       screen.height 화면 높이

       screen.availWidth : 실제 사용 가능한 화면 너비
       screen.availHeight : 실제 사용 가능한 화면 높이
          작업표시줄 X

       screen.colorDepth : 색 농도
          16비트 : 65536가지
          32비트 : 42억 가지
          등등
  </xmp>
  <p id="demo"></p>
</div> 
<script>
  let output = `${screen.width} / ${screen.height} <br>
                ${screen.availWidth} / ${screen.availHeight} <br>
                ${screen.colorDepth}`  ;
  $("#demo").html( output );
  </script>
</body>
