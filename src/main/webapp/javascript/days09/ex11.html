<body>
<header>
  <h1 class="main"><a href="#" style="position: absolute;top:30px;">Jam HOme</a></h1>
  <ul>
    <li><a href="#">로그인</a></li>
    <li><a href="#">회원가입</a></li>

</header>
<div>
  <xmp class="code">
    BOM-window, screen, location, history

    [ navigator ]
    방문자의 브라우저에 대한 정보가 포함되어 있는 객체.

  </xmp>

  <script>
    // 브라우저 응용 프로그램 이름
    document.write(`${navigator.appName}`+"<br>");
    // 브라우저 버전 정보
    document.write(`${navigator.appVersion}`+"<br>");
    // 브라우저의 엔진의 제품명
    document.write(`${navigator.product}`+"<br>");
    // 브라우저의 쿠키 사용여부
    document.write(`${navigator.cookieEnabled}`+"<br>");
    // 자바의 활성화 여부
    document.write(`${navigator.javaEnabled}`+"<br>");
    // 브라우저의 플랫폼(운영체제)
    document.write(`${navigator.platform}`+"<br>");
  </script>
</div> 
</body>
