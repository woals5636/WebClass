  *{
      box-sizing: border-box;
   }
    .alert{
      padding: 20px;
      background-color: #f44336;
      color:white;
      opacity: 1; 
      transition:opacity 0.6s, height 0.6s;
      margin-bottom: 15px;
   }
   
    .closebtn{
     margin-left: 15px;
     color:white;
     font-weight: bold;
     float:right;
     font-size: 22px;
     line-height: 20px;
     cursor:pointer;
     transition:0.3s;
   }
   .closebtn:hover{
      color:black;
   }
   
   .alert.success{     background-color: #4caf50;   }
   .alert.info{      background-color: #2196f3;   }
   .alert.warning{     background-color: #ff9800;   }
   
</style>

  <h2>알림(공지사항)</h2>

   <select name="type" id="type">
      <option>type 없음</option>
      <option>success</option>
      <option>warning</option>
      <option>info</option>
   </select>
   <br>
   내용  : <input type="text" />
   <button>공지사항 추가</button>
   <br>
   
   <hr>

<script>
  // JSP JDBC DB 연동 SELECT + AJAX + JSON 처리
  let data = [
    {type:"success",  message:"Lorem ipsum dolor sit amet, consectetur adipisicing."},
    {type:"warning", message:"Lorem ipsum dolor sit amet, consectetur adipisicing."},
    {type:"info", message:"Lorem ipsum dolor sit amet, consectetur adipisicing."},
    {type:"success", message:"Lorem ipsum dolor sit amet, consectetur adipisicing."}
  ];

  for (const notice of data) {
    // document.write( notice.type + "/" + notice.message + "<br>")
    let content = `<div class="alert ${notice.type}">
                     <span class="closebtn">&times;</span>
                     <strong>${notice.type}!</strong>
                     ${notice.message}
                  </div>`;
    $("div").first().append(content);
  }

  document.querySelector("button").addEventListener("click", function() {
    let type = document.querySelector("#type").value;
    let message = document.querySelector("input[type=text]").value;

    if (message === "") {
        alert("공지사항 내용 입력하세요~~");
        return;
    }
    if (type === "type 없음") {
        alert("타입 선택하세요~~");
        return;
    }

    let content = `<div class="alert ${type}">
                     <span class="closebtn">&times;</span>
                     <strong>${type}!</strong>
                     ${message}
                  </div>`;

    $("div hr").after(content);
    
    // 'div hr' 요소 뒤에 content 추가 (jQuery 대신 JavaScript 사용)
    /*
    let hrElement = document.querySelector("div hr");
    if (hrElement) {
        hrElement.insertAdjacentHTML('afterend', content);
    }
    */

});

  $("span.closebtn").on("click",function(){
    const parentDiv = $(this).parent();
    parentDiv.css("opacity","0");
    setTimeout(() => {
      // parentDiv.hide();
      parentDiv.css("display","none");
    }, 600);
})
   
   // noticeElement > span.closebtn click 이벤트 등록
   $("div.alert").first().find("span.closebtn").on("click",function(){
    const parentDiv = $(this).parent();
    parentDiv.css("opacity","0");
    setTimeout(() => {
      // parentDiv.hide();
      parentDiv.css("display","none");
    }, 600);
})




</script>
