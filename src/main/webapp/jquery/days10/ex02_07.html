 }

<body>
<header>
  <h1 class="main"><a href="#" style="position: absolute;top:30px;">Jam HOme</a></h1>
  <ul>
    <li><a href="#">로그인</a></li>
    <li><a href="#">회원가입</a></li>
  </ul>
</header>
<div id="content">
  <xmp class="code">
  </xmp>

  <button class="btn1">change color</button>
  <div>Div1</div>
  <div>Div2</div>
  <div>Div3</div>

  <input type="text"><br>
  <input type="text"><br>
  <input type="text"><br>
  <input type="text"><br>
  <input type="text"><br>

</div> 
<script>
  // $("input[type=text]")
  $(":text").addClass("full");
  $(":text:eq(2)").focus();
  $(":focus").css("background-color","red");
</script>
<script>
    $("#content div").first().css("background-color","red");
    $("#content div").eq(1).css("background-color","green");
    $("#content div").last().css("background-color","blue");

  function animate_div(){
    $("#content div").first()
                     .animate({width:"50%"},"slow")
                     .animate({width:"100%"},"slow", animate_div);
  }

  animate_div();

  $(".btn1").on("click",function(){
    $("#content div:animated").css("background-color","lightblue");
  })
</script>
</body>
